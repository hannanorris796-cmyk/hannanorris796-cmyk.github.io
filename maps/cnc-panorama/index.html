<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>数控技术产业图谱</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="refine.css" />
  <link rel="stylesheet" href="panorama.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="eyebrow">INDUSTRY KNOWLEDGE ATLAS / 01</div>
      <div class="title-line"><h1>产业图谱</h1><span>产业链节点—专业—岗位—工作任务—岗位能力—技能&知识点</span></div>
    </header>
    <div class="map-name"><i></i><strong id="mapTitle">数控技术产业全景图</strong><span id="pathHint">滚轮缩放 · 拖拽平移 · 点击节点聚焦</span><button id="zoomOut" type="button" aria-label="缩小图谱">−</button><span id="zoomValue">100%</span><button id="zoomIn" type="button" aria-label="放大图谱">+</button><button id="resetView" type="button">复位</button></div>
    <main id="viewport" class="graph-scroll">
      <div id="stage"><div id="graph" class="panorama-graph"><svg id="edges" aria-hidden="true"></svg><div id="canvasNodes"></div></div></div>
    </main>
    <footer><span>产业链图谱</span><span id="sourceText"></span></footer>
  </div>
  <script src="panorama-data.js"></script><script src="panorama.js"></script>
</body>
</html>
