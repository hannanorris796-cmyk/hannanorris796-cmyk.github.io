<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embedded')</script>
  <title>数控技术产业图谱</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="refine.css" />
  <link rel="stylesheet" href="cnc.css" />
</head>
<body>
  <div class="app">
    <header>
      <div class="eyebrow">INDUSTRY KNOWLEDGE ATLAS / 01</div>
      <div class="title-line"><h1>产业图谱</h1><span>产业链节点—专业—岗位—工作任务—岗位能力—技能&知识点</span></div>
    </header>
    <div class="map-name"><i></i><strong id="mapTitle">数控技术产业图谱</strong><span id="pathHint"></span>
      <div class="zoom-controls" role="group" aria-label="图谱缩放">
        <button id="zoomOut" type="button" aria-label="缩小图谱">−</button>
        <output id="zoomValue" aria-live="polite">100%</output>
        <button id="zoomIn" type="button" aria-label="放大图谱">+</button>
        <button id="zoomFit" type="button" aria-label="适配窗口">适配</button>
      </div>
    </div>
    <main class="graph-scroll">
      <div id="graphStage" class="graph-stage">
        <div id="graph" class="graph">
          <svg id="edges" aria-hidden="true"></svg>
          <div id="columns" class="columns"></div>
        </div>
      </div>
    </main>
    <footer><span>产业链图谱</span><span id="sourceText"></span></footer>
  </div>
  <script src="data.js"></script><script src="cnc-app.js"></script>
</body>
</html>
